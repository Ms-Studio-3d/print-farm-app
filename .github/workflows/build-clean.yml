name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies for Node
        run: npm ci --no-audit --no-fund
      - name: Run Node tests before rebuilding native modules for Electron
        run: npm test
      - name: Rebuild native dependencies for Electron
        run: npm run rebuild
      - name: Verify SQLite and stability scenarios under actual Electron runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $process = Start-Process -FilePath .\node_modules\electron\dist\electron.exe -ArgumentList 'tests\electron-runtime-smoke.cjs' -NoNewWindow -Wait -PassThru
          $result = $process.ExitCode
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          if ($result -ne 0) { exit $result }
      - name: Build Windows installer
        run: npm run dist:installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOO3D-Windows-Installer-1.8.11
          path: dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
